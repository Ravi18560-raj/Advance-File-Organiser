[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-file-manager"
version = "1.0.0"
description = "Organize, deduplicate, analyze and search files from the command line"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
sfm = "smart_file_manager.cli:main"

[tool.setuptools]
packages = ["smart_file_manager"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
